name: HEARTFUL TREE - test and build
on:
  pull_request:
    paths:
      - 'christmas-tree/**'
      - '.github/workflows/christmas-tree-test.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Cloudflare/backend and tree growth logic
        working-directory: christmas-tree
        run: |
          npm test
          node --check app.js
          node --check tree3d.js
      - name: Compile Cloudflare Pages static bundle
        working-directory: christmas-tree
        run: npm run build
      - name: Check emitted files
        run: |
          test -f christmas-tree/dist/index.html
          test -f christmas-tree/dist/tree-core.js
          test -f christmas-tree/dist/tree3d.js
          test -f christmas-tree/dist/data/ornaments.json
          test -f christmas-tree/dist/data/archive.json
          test -f christmas-tree/dist/archive.html
          test -f christmas-tree/dist/assets/royal-tree.svg
          test -f christmas-tree/dist/assets/royal-tree.avif
      - name: Test optional legacy RSS collector
        run: python3 -m unittest discover -s christmas-tree/tests -p 'test_*.py' -v
