<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#120c21">
    <meta name="description" content="届いたお店のURLを訪ねて、ハロウィンのお菓子を集めよう。">
    <title>Trick or Treat Collection</title>
    <link rel="stylesheet" href="/styles.css?v=20260929-3">
    <script type="module" src="/app.js?v=20260929-3"></script>
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <header class="topbar">
      <a class="brand" href="#/collection" aria-label="図鑑を見る">
        <span class="brand-mark" aria-hidden="true">☾</span>
        <span>Trick or Treat</span>
      </a>
      <button class="account-chip" id="account-button" type="button" aria-label="参加ID">
        <span class="account-dot"></span>
        <span id="account-label">参加する</span>
      </button>
    </header>

    <main id="app" class="app-shell" aria-live="polite">
      <div class="page-loader"><span></span><span></span><span></span></div>
    </main>

    <nav class="bottom-nav" aria-label="メインメニュー">
      <a href="#/studio" data-nav="studio">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span>お店をひらく</span>
      </a>
      <a href="#/collection" data-nav="collection">
        <span class="nav-icon" aria-hidden="true">▦</span>
        <span>図鑑</span>
      </a>
    </nav>

    <div id="toast" class="toast" role="status"></div>
    <div id="overlay" class="overlay" hidden></div>
  </body>
</html>
